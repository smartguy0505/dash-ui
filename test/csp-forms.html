<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forms under a strict CSP</title>
<link rel="stylesheet" href="../dash.css">
<script src="../dash.js"></script>
</head>
<!-- test/behaviour.mjs serves this page with Content-Security-Policy: style-src 'self' -->
<body>
<main class="page">
  <form class="panel" id="strict"><div class="field"><label for="x">X</label><input class="input" id="x" name="x" required></div><input class="input" name="bare" required aria-label="Bare"><button class="btn">Go</button></form>
</main>
<script>
  Dash.config.csp = true;
  window.violations = [];
  document.addEventListener('securitypolicyviolation', (e) => violations.push(e.violatedDirective));
  window.f = Dash.form('strict');
</script>
</body>
</html>

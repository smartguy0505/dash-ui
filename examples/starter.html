<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My dashboard</title>
<link rel="stylesheet" href="../dash.css">
<script src="../dash.js"></script>
</head>
<body>
<!-- the smallest useful page: copy this file, point the two links at dash.css and dash.js, and fetch your data in Dash.poll -->
<header class="topbar">
  <div class="brand"><span class="mark">M</span><h1>My dashboard</h1></div>
  <span class="sub">what this page watches</span>
  <div class="top-right"><span id="live"></span></div>
</header>

<main class="page">
  <div class="stats" id="stats"></div>
  <div class="panel">
    <div class="panel-head"><h3>Items</h3><span class="read" id="count"></span></div>
    <div id="table"></div>
  </div>
</main>

<script>
  const { fmt } = Dash;
  const STATUS = { ok: 'Healthy', warn: 'Slow', bad: 'Down' };
  // a sortable table (cards on a phone) from its columns; the sort is remembered
  const table = Dash.table('table', {
    columns: [
      { key: 'name', label: 'Name', main: true, firstDir: 'asc' },
      { key: 'value', label: 'Value', num: true, format: (v) => fmt.num(v, 1) },
      { key: 'status', label: 'Status', sort: false, html: (i) => Dash.pill(STATUS[i.status], i.status) },
      { key: 'at', label: 'Updated', num: true, html: (i) => Dash.ago(i.at) },
    ],
    sort: { key: 'value', dir: 'desc', store: 'starter.sort' },
  });

  function render(items) {
    Dash.render('stats', Dash.stat('Items', fmt.int(items.length)) + Dash.stat('Total', fmt.num(Dash.sum(items, 'value'), 1))
      + Dash.stat('Problems', fmt.int(items.filter((i) => i.status !== 'ok').length)));
    Dash.render('count', fmt.plural(items.length, 'item'));
    table.update(items);
  }

  // every 15 s; the live status in the top bar follows on its own (Live, the error, or stale)
  Dash.poll(async () => {
    render([ // replace with: render(await Dash.api('api/items'));
      { name: 'atlas', value: 1234.5, status: 'ok', at: Date.now() - 40e3 },
      { name: 'boreal', value: 88.2, status: 'warn', at: Date.now() - 9 * 60e3 },
      { name: 'cirrus', value: 0, status: 'bad', at: Date.now() - 3 * 3600e3 },
    ]);
  }, 15000, { live: 'live' });
</script>
</body>
</html>

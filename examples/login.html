<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in · Accounts</title>
<link rel="stylesheet" href="../dash.css">
<script src="../dash.js"></script>
</head>
<body class="login-page">
<!-- a sign-in page. In a real app the form posts to the server (fetch, or a plain GET/POST that nginx checks);
     here any password of 4+ characters "works", and "wrong" shows the error. -->
<form class="login" id="form">
  <h1>Accounts</h1>
  <p class="lead">Sign in to see the account balances.</p>
  <div class="field">
    <label for="password">Password</label>
    <input class="input" type="password" id="password" name="password" autocomplete="current-password" required autofocus>
  </div>
  <button type="submit" class="btn primary block">Sign in</button>
  <p class="note">You stay signed in on this browser until the server restarts or you sign out.</p>
</form>
<script>
  const { $ } = Dash;
  // an empty box and a wrong password show under it; a server that doesn't answer shows above the button
  Dash.form('form', {
    onSubmit: async ({ password }) => {
      await new Promise((r) => setTimeout(r, 400)); // stands in for: await Dash.api('api/login', { method: 'POST', json: { password } })
      if (password === 'down') throw new Error('The server didn’t answer. Try again in a moment.');
      if (password.length >= 4 && password !== 'wrong') { Dash.toast('Signed in'); return; }
      $('password').value = '';
      throw Object.assign(new Error('Wrong password'), { errors: { password: 'That password didn’t work. Check it and try again.' } });
    },
  });
</script>
</body>
</html>

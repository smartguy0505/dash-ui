<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents · dash-ui example</title>
<link rel="stylesheet" href="../dash.css">
<script src="../dash.js"></script>
</head>
<body>
<!-- an agent-dash style page: top bar with plan limits, a sidebar of agents, an overview of panels and cards -->
<header class="topbar">
  <div class="brand">
    <button type="button" class="side-toggle" data-toggle-side aria-label="Sidebar"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="3" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 3v12" stroke="currentColor" stroke-width="1.5"/></svg></button>
    <h1>Claude agents</h1>
  </div>
  <span class="topstat"><b>Session</b> <span class="meter"><i style="width:42%"></i></span> <span class="v">42%</span> <span class="muted">resets 19:00</span></span>
  <span class="topstat warn"><b>Week</b> <span class="meter"><i style="width:78%"></i></span> <span class="v">78%</span> <span class="muted">resets Thu</span></span>
  <div class="top-right"><span id="live"></span></div>
</header>

<div class="shell">
  <nav class="sidebar" aria-label="Agents" id="sidebar"></nav>
  <main class="content">
    <div class="row" style="margin-bottom:22px">
      <h2 class="page-title" style="margin-right:8px">Overview</h2>
      <span id="counts" class="row"></span>
    </div>

    <h3 class="section-title">Today</h3>
    <div class="stats" style="--stat-min:220px">
      <div class="stat"><div class="label">Tokens</div><div class="value">4.82M <small>· 12 agents</small></div>
        <dl class="kv" style="margin-top:8px"><div><dt>Input</dt><dd>1.2M</dd></div><div><dt>Output</dt><dd>380k</dd></div><div><dt>Cache read</dt><dd>3.1M</dd></div><div><dt>Cache write</dt><dd>140k</dd></div></dl></div>
      <div class="stat"><div class="label">Busiest hour</div><div class="value">612k</div><div class="note">10:00–11:00 · 6 agents</div></div>
      <div class="stat"><div class="label">Needs you</div><div class="value tone orange">2</div><div class="note">oldest waiting 4m</div></div>
    </div>

    <div class="grid" style="--cols:2;margin-bottom:28px">
      <div class="panel">
        <div class="panel-head"><h3>By status</h3></div>
        <div class="donut-wrap" id="donut"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Plan limits</h3></div>
        <div class="gauges" id="gauges"></div>
      </div>
      <div class="panel span-2">
        <div class="panel-head"><h3>Tokens per hour</h3><div class="seg" id="range"><button type="button" data-value="12">12 h</button><button type="button" data-value="24">24 h</button></div></div>
        <div class="chart-read" id="read"></div>
        <div id="bars"></div>
      </div>
    </div>

    <section id="groups"></section>
  </main>
</div>

<script>
  const { $, esc, fmt } = Dash;
  const STATUS = { busy: ['Working', 'blue'], waiting: ['Needs you', 'orange'], shell: ['Shell', 'purple'], idle: ['Idle', 'idle'] };
  const now = Date.now();
  const AGENTS = [
    { id: 'a1', name: 'bm-dash review', title: 'Check bm dashboard against bm 0.24.1', status: 'busy', since: now - 4 * 60e3, model: 'Opus 5.5', tokens: 812000 },
    { id: 'a2', name: 'wallet 24h', title: 'Add the 24 h change to the wallet dashboard', status: 'waiting', since: now - 12e3, model: 'Opus 5.5', tokens: 604000, waiting: 'Approve: git push origin main' },
    { id: 'a3', name: 'eth3 rebuild', title: 'Rebuild the reth binary with the new flags', status: 'shell', since: now - 22 * 60e3, model: 'Sonnet 5.5', tokens: 377000 },
    { id: 'a4', name: 'payout pager', title: 'Paginate the payout dashboard', status: 'idle', since: now - 2 * 3600e3, model: 'Opus 5.5', tokens: 120500 },
    { id: 'a5', name: 'docs pass', title: 'Tidy the READMEs', status: 'waiting', since: now - 4 * 60e3, model: 'Haiku 5.5', tokens: 88000, waiting: 'Which README first?' },
    { id: 'a6', name: 'bursts check', title: 'Compare nodes.json with bm miner ls', status: 'busy', since: now - 9 * 60e3, model: 'Opus 5.5', tokens: 230000 },
  ];
  let current = 'overview';

  function renderSidebar() {
    const item = (a) => {
      const [label, tone] = STATUS[a.status];
      return `<button type="button" class="nav-item ${tone}${a.status === 'waiting' ? ' attn' : ''}" data-id="${esc(a.id)}"${current === a.id ? ' aria-current="true"' : ''} title="${esc(a.name)}">
        <span class="nav-icon"><span class="dot${a.status === 'waiting' ? ' pulse' : ''}" style="width:10px;height:10px"></span></span>
        <span class="nav-main"><span class="nav-name">${esc(a.name)}</span><span class="nav-sub">${esc(a.title)}</span></span>
        <span class="nav-meta"><span class="tone">${esc(label)}</span><span>${fmt.dur(now - a.since)}</span></span></button>`;
    };
    $('sidebar').innerHTML = `<button type="button" class="nav-item" data-id="overview"${current === 'overview' ? ' aria-current="true"' : ''} title="Overview">
        <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="2" width="5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="9" width="5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="5" height="5" rx="1.2" stroke="currentColor" stroke-width="1.4"/></svg></span>
        <span class="nav-main"><span class="nav-name">Overview</span></span></button>
      <div class="side-head">Running <span class="count-badge">${AGENTS.length}</span></div>${AGENTS.map(item).join('')}`;
  }
  Dash.on('sidebar', 'click', '[data-id]', (e, b) => { current = b.dataset.id; renderSidebar(); if (current !== 'overview') Dash.toast(`Open ${b.title}`); });

  function renderOverview() {
    const n = (s) => AGENTS.filter((a) => a.status === s).length;
    $('counts').innerHTML = Object.entries(STATUS).map(([s, [label, tone]]) => `<span class="pill ${tone}"><span class="dot${s === 'waiting' ? ' pulse' : ''}"></span>${n(s)} ${esc(label.toLowerCase())}</span>`).join('');
    const segs = Object.entries(STATUS).map(([s, [label, tone]]) => ({ label, value: n(s), tone }));
    $('donut').innerHTML = Dash.donut(segs, { center: String(AGENTS.length), sub: 'agents' }) + Dash.legend(segs, { list: true });
    $('gauges').innerHTML = Dash.gauge(0.42, { name: 'Session', sub: 'resets 19:00' }) + Dash.gauge(0.78, { name: 'Week', sub: 'resets Thu 08:00' });
    // cards grouped by status, the ones that need you first
    $('groups').innerHTML = ['waiting', 'busy', 'shell', 'idle'].map((s) => {
      const list = AGENTS.filter((a) => a.status === s);
      if (!list.length) return '';
      const [label, tone] = STATUS[s];
      return `<div class="section"><div class="section-head"><h3 class="section-title tone ${tone}" style="color:var(--c)">${esc(label)}</h3><span class="count-badge">${list.length}</span></div>
        <div class="cards" style="--card-min:340px">${list.map((a) => `
          <article class="card${s === 'waiting' ? ' ring orange' : ''}">
            <div class="card-head"><div class="grow"><h4 class="card-title">${esc(a.name)}</h4><div class="card-sub">${esc(a.title)}</div></div>
              ${Dash.pill(`${label} · ${fmt.dur(now - a.since)}`, tone)}</div>
            ${a.waiting ? `<div class="callout orange"><div class="callout-title">Waiting for</div><b>${esc(a.waiting)}</b></div>` : `<div class="callout"><div class="callout-title">Last message</div><span class="clamp" style="--lines:2">${esc(a.title)}: working through it, two of five checks done.</span></div>`}
            <ul class="facts" style="margin:0;padding:0;list-style:none"><li>${esc(a.model)}</li><li>${fmt.compact(a.tokens)} tokens</li><li>~/projects/${esc(a.id)}</li></ul>
          </article>`).join('')}</div></div>`;
    }).join('');
  }

  const HOURS = Array.from({ length: 24 }, (_, i) => ({ label: String((i + 15) % 24).padStart(2, '0') + ':00', value: Math.round(80000 + 220000 * Math.abs(Math.sin(i / 3.5))) }));
  HOURS[23].partial = true;
  const range = Dash.seg('range', { value: '24', store: 'example.range', onChange: renderBars });
  function renderBars() {
    const pts = HOURS.slice(-Number(range.value));
    $('bars').innerHTML = Dash.bars(pts, { labelEvery: 3, minorEvery: 6 });
    $('read').textContent = `${fmt.compact(pts.reduce((s, p) => s + p.value, 0))} tokens in ${range.value} h`;
  }
  Dash.on('bars', 'mouseover', '.chart-col', (e, c) => { $('read').textContent = c.title; });

  Dash.live('live', 'on', 'Live', 'Updated just now');
  renderSidebar();
  renderOverview();
  renderBars();
  // an agent that starts needing you gets a notice in the corner
  setTimeout(() => Dash.notify({ key: 'a5', title: 'docs pass', status: 'needs you', text: 'Which README first?', onClick: () => { current = 'a5'; renderSidebar(); } }), 1200);
</script>
</body>
</html>
